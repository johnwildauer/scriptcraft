[package]
name = "scriptcraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard = "3.7.0"
eframe = "0.34"
egui_material_icons = { version = "0.6.0", features = ["outline"] }
rfd = "0.15"
scriptcraft-commands = { path = "../../crates/scriptcraft-commands" }
scriptcraft-core = { path = "../../crates/scriptcraft-core" }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }

# Retain the package-local safety and Clippy policy after removing the
# experiment-only AppKit bridge; the workspace safety policy remains unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
