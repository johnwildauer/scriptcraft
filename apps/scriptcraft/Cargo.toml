[package]
name = "scriptcraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ab_glyph = "=0.2.32"
arboard = "3.7.0"
eframe = "0.34"
egui_material_icons = { version = "0.6.0", features = ["outline"] }
font-kit = { version = "=0.14.3", default-features = false, features = ["source"] }
directories = "6.0"
rfd = "0.15"
serde = { version = "=1.0.229", features = ["derive"] }
scriptcraft-commands = { path = "../../crates/scriptcraft-commands" }
scriptcraft-export = { path = "../../crates/scriptcraft-export" }
scriptcraft-fdx = { path = "../../crates/scriptcraft-fdx" }
scriptcraft-layout = { path = "../../crates/scriptcraft-layout" }
scriptcraft-model = { path = "../../crates/scriptcraft-model" }
scriptcraft-session = { path = "../../crates/scriptcraft-session" }
toml = "=1.2.1"
ttf-parser = "=0.25.1"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-numerics = "=0.3.1"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "=0.62.2", default-features = false, features = ["Foundation", "Graphics_Printing", "Graphics_Printing_OptionDetails", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Printing", "Win32_Storage_Xps_Printing", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_WinRT_Printing", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSMenu", "NSMenuItem", "NSPanel", "NSPrintInfo", "NSPrintOperation", "NSPrintPanel", "NSResponder", "NSSavePanel", "NSView", "NSViewController", "NSWindow", "NSImage", "objc2-core-foundation", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSAppleEventDescriptor", "NSAppleEventManager", "NSGeometry", "NSNotification", "NSObject", "NSSet", "NSString", "NSURL", "objc2-core-services"] }
objc2-core-services = { version = "=0.3.2", default-features = false, features = ["std", "AEDataModel", "AppleEvents"] }
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["UTCoreTypes", "UTType"] }

# Retain the package-local safety and Clippy policy after removing the
# experiment-only AppKit bridge; the workspace safety policy remains unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
