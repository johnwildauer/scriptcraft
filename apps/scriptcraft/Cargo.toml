[package]
name = "scriptcraft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.29"
rfd = "0.15"
scriptcraft-core = { path = "../../crates/scriptcraft-core" }

# Retain the package-local safety and Clippy policy after removing the
# experiment-only AppKit bridge; the workspace safety policy remains unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
