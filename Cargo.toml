[workspace]
resolver = "2"
members = [
    "apps/scriptcraft",
    "crates/scriptcraft-commands",
    "crates/scriptcraft-core",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
